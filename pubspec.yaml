name: flutter_base
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  intl_utils: ^2.8.16
  cupertino_icons: ^1.0.9

  # Configs
  flutter_dotenv: ^6.0.1
  sentry_flutter: ^9.30.1
  go_router: ^18.0.1
  dio: ^5.11.1
  package_info_plus: ^10.2.1
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^13.0.2
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  webview_flutter_android: ^4.14.1
  url_launcher: ^6.3.2
  lottie: ^3.6.1
  another_flushbar: ^2.2.4

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_analytics: ^12.6.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  app_tracking_transparency: ^2.0.7

  # Utils 13
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.0
  flutter_animate: ^4.5.2
  flutter_animated_dialog_updated: ^1.0.1
  dropdown_button2: ^3.1.0
  skeletonizer: ^3.0.0
  share_plus: ^13.3.0
  flutter_html: ^3.0.0
  appsflyer_sdk: ^7.0.2+2-rc1
  image_picker: ^1.2.3

  # rainmakers_design_system:
  #   path: ../../DesignSystem/rainmakers_design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^4.0.1 # pending update
  build_runner: ^2.16.1
  yaml: ^3.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/lotties/
    # - assets/videos/
    - assets/rive/
    - assets/lang/
    - assets/lang/countries/
    - .env.beta
    - .env.live

  fonts:
    - family: ABCDiatype
      fonts:
        - asset: assets/fonts/abcdiatype-regular.otf
          style: normal
          weight: 400
        - asset: assets/fonts/abcdiatype-medium.otf
          style: normal
          weight: 500
        - asset: assets/fonts/abcdiatype-bold.otf
          style: normal
          weight: 700
        - asset: assets/fonts/abcdiatype-regularitalic.otf
          style: italic
          weight: 400
        - asset: assets/fonts/abcdiatype-mediumitalic.otf
          style: italic
          weight: 500
        - asset: assets/fonts/abcdiatype-bolditalic.otf
          style: italic
          weight: 700

flavorizr:
  ide: "vscode"
  app:
    android:
      flavorDimensions: "flavor-type"

  flavors:
    beta:
      app:
        name: "FlutterBase (Beta)"

      android:
        applicationId: "com.flutterbase.beta"
        firebase:
          config: ".firebase/beta/google-services.json"
        customConfig:
          signingConfig: signingConfigs.release_beta
      ios:
        bundleId: "com.flutterbase.beta"
        firebase:
          config: ".firebase/beta/GoogleService-Info.plist"

    live:
      app:
        name: "FlutterBase"

      android:
        applicationId: "com.flutterbase.live"
        firebase:
          config: ".firebase/live/google-services.json"
        customConfig:
          signingConfig: signingConfigs.release_live
      ios:
        bundleId: "com.flutterbase.live"
        firebase:
          config: ".firebase/live/GoogleService-Info.plist"

flutter_intl:
  enabled: true
  main_locale: es
  arb_dir: lib/src/shared/presentation/l10n
  output_dir: lib/src/shared/presentation/l10n/generated
