pre-commit:
  commands:
    remove-google-services:
      run: |
        git reset HEAD -- ios/Runner/GoogleService-Info.plist
        git checkout ios/Runner/GoogleService-Info.plist
    analyze:
      glob: "*.dart"
      exclude:
        - rive_native-0.0.6/*
        - lib/src/shared/presentation/l10n/generated/*
      run: fvm flutter analyze {staged_files}
    format:
      glob: "**/*.dart"
      exclude:
        - rive_native-0.0.17/**
        - lib/src/shared/presentation/l10n/generated/**
        - build/**
        - "**/*.g.dart"
        - "**/*.gform.dart"
        - "**/*.freezed.dart"
      stage_fixed: true
      run: fvm dart format {staged_files}
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: commitlint --edit $1
